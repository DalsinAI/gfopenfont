name: GFOpenFont CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopenrtg
          ref: a14091d9b7e286f93aa335861934c574c3a6b29c   # main after the GFOpenGPU header rename
          path: gfopenrtg
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake fonts-dejavu-core fonts-liberation2 fonts-noto-color-emoji libcairo2-dev
      - name: Configure
        run: cmake -S . -B build -DOPENFONT_OPENAMIGARTG=$GITHUB_WORKSPACE/gfopenrtg
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp10 libmpfr6 libmpc3
      - name: GFOpenAmigaGCC 16.2.0-open6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v16.2.0-open6 --repo DalsinAI/gfopengcc \
            --pattern 'gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz' \
            --pattern 'SHA256SUMS'
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xJf gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
      - name: 68040
        run: CC="$GITHUB_WORKSPACE/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin/m68k-amigaos-gcc" sh amiga/build.sh
      - name: GFOpenNDK
        run: git clone --depth 1 https://github.com/DalsinAI/gfopensdk.git "$RUNNER_TEMP/gfopensdk"
      - name: gfopenfont.library
        run: |
          CC="$GITHUB_WORKSPACE/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin/m68k-amigaos-gcc" \
          NDK="$RUNNER_TEMP/gfopensdk/OpenNDK/Include_H" OPENGPU_INCLUDE="$RUNNER_TEMP/gfopensdk/Include" \
          sh amiga/build-library.sh
      - name: SDK files match the SFD
        run: python3 "$RUNNER_TEMP/gfopensdk/OpenNDK/tools/ndkgen.py" --out sdk --stubs sdk/stubs --check sdk/SFD/gfopenfont_lib.sfd
